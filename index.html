<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="todo-card">
      <h1>My To-Do List</h1>
      <p class="subtitle">Full-stack task manager</p>

      <div class="input-area">
        <input type="text" id="taskInput" placeholder="Enter a task..." maxlength="100">
        <button id="addBtn">Add Task</button>
      </div>

      <div class="task-info">
        <span id="taskCount">0 tasks</span>
        <button id="clearBtn" class="clear-btn">Clear All</button>
      </div>

      <ul id="taskList"></ul>
      <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
